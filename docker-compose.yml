services:
  flow-engine-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flow-engine-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FLOW_ENGINE_STATE_DIR: /state
      FLOW_ENGINE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8080/health\") === false ? 1 : 0);'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./workspace:/workspace:ro
      - ./state:/state
    command: ["api", "/workspace", "--host=0.0.0.0", "--port=8080"]
